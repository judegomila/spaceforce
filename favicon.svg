<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="ball" cx="0.35" cy="0.3" r="1">
      <stop offset="0" stop-color="#ffd9a0"/>
      <stop offset="0.55" stop-color="#ffb454"/>
      <stop offset="1" stop-color="#c77f2a"/>
    </radialGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f99a4"/>
      <stop offset="0.5" stop-color="#e8edf2"/>
      <stop offset="1" stop-color="#aab4bf"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="13" fill="#04060b"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="11.5" fill="none" stroke="#1c2836" stroke-width="1"/>
  <!-- stars -->
  <circle cx="14" cy="14" r="1.3" fill="#4fd8cf" opacity="0.9"/>
  <circle cx="50" cy="10" r="1" fill="#9dbdd8" opacity="0.8"/>
  <circle cx="55" cy="48" r="1" fill="#9dbdd8" opacity="0.6"/>
  <!-- hinge -->
  <circle cx="10" cy="46" r="3.4" fill="#39424e"/>
  <!-- diverging rails, hinged bottom-left, rising uphill to the right -->
  <path d="M10 46 L57 15" stroke="url(#rail)" stroke-width="4.2" stroke-linecap="round"/>
  <path d="M10 46 L59 30" stroke="url(#rail)" stroke-width="4.2" stroke-linecap="round"/>
  <!-- ball riding the rails -->
  <circle cx="37" cy="26.5" r="9" fill="url(#ball)"/>
  <circle cx="33.8" cy="23.2" r="2.6" fill="#fff2df" opacity="0.9"/>
</svg>
