name: Repurpose A-D as common rod twist

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repurpose-ad-twist.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Remove artificial rail translation and remap A-D
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def one(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              found = text.count(old)
              if found != 1:
                  raise SystemExit(f'{path}: expected one match, found {found}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Keyboard and pointer bindings: A/D now rotate both rods together.
          one('js/main.js', "if (k === 'd') keys.add('right');", "if (k === 'd') keys.add('common-pos');")
          one('js/main.js', "if (k === 'a') keys.add('left');", "if (k === 'a') keys.add('common-neg');")
          one('js/main.js', "if (k === 'd') keys.delete('right');", "if (k === 'd') keys.delete('common-pos');")
          one('js/main.js', "if (k === 'a') keys.delete('left');", "if (k === 'a') keys.delete('common-neg');")
          one('js/main.js', "  // From the default camera, screen-right is -z in the rail frame.\n", "  // A/D are a physical common-twist shorthand; Q/E and U/O add independent trim.\n")
          one('js/main.js', "  sim.setManualShift((keys.has('left') ? 1 : 0) - (keys.has('right') ? 1 : 0));\n", "  const common = (keys.has('common-pos') ? 1 : 0) - (keys.has('common-neg') ? 1 : 0);\n")
          one('js/main.js', "  const minus = (keys.has('l-pos') ? 1 : 0) - (keys.has('l-neg') ? 1 : 0);", "  const minus = common + (keys.has('l-pos') ? 1 : 0) - (keys.has('l-neg') ? 1 : 0);")
          one('js/main.js', "  const plus = (keys.has('r-pos') ? 1 : 0) - (keys.has('r-neg') ? 1 : 0);", "  const plus = common + (keys.has('r-pos') ? 1 : 0) - (keys.has('r-neg') ? 1 : 0);")
          one('js/main.js', "holdButton('btn-left', 'left');", "holdButton('btn-common-neg', 'common-neg');")
          one('js/main.js', "holdButton('btn-right', 'right');", "holdButton('btn-common-pos', 'common-pos');")

          # Remove the nonphysical whole-rig lateral degree of freedom.
          one('js/physics.js', "  // lateral translation of the whole arm assembly\n", "  // No whole-rig lateral translation: the physical apparatus only opens and twists.\n")
          one('js/physics.js', "  zMax: 0.025,\n", '')
          one('js/physics.js', "  zRateMax: 0.04,\n", '')
          one('js/physics.js', "    this.z = 0;\n", '')
          one('js/physics.js', "    this.zDot = 0;\n", '')
          one('js/physics.js', "    this.manualShift = 0;\n", '')
          one('js/physics.js', "  setManualShift(r) { this.manualShift = clamp(r, -1, 1); }\n", '')
          one('js/physics.js', "    // Translate the whole rail assembly laterally.\n", '')
          one('js/physics.js', "    this.zDot = this.manualShift * P.zRateMax;\n", '')
          one('js/physics.js', "    const zNext = clamp(this.z + this.zDot * dt, -P.zMax, P.zMax);\n", '')
          one('js/physics.js', "    if (zNext === -P.zMax || zNext === P.zMax) this.zDot = 0;\n", '')
          one('js/physics.js', "    this.z = zNext;\n", '')
          one('js/physics.js', "      z: this.z + this.zRel,", "      z: this.zRel,")
          one('js/physics.js', "      vz: this.zDot + this.zRelDot,", "      vz: this.zRelDot,")

          one('js/scene.js', "    this.arms.position.z = sim.z;\n", '')
          one('js/scene.js', "this.ball.position.set(sim.x, P.a * sim.delta, sim.z + sim.zRel);", "this.ball.position.set(sim.x, P.a * sim.delta, sim.zRel);")
          one('js/scene.js', "this.ring.position.set(xPred, 0.002, sim.z + sim.zRel);", "this.ring.position.set(xPred, 0.002, sim.zRel);")
          one('js/hud.js', "const zNow = rolling ? sim.z + sim.zRel : (sim.flight ? sim.flight.z : sim.z + sim.zRel);", "const zNow = rolling ? sim.zRel : (sim.flight ? sim.flight.z : sim.zRel);")

          # UI: common twist on A/D, independent trim remains on Q/E and U/O.
          one('index.html', '<label>RIG OFFSET z</label>', '<label>BALL OFFSET z</label>')
          old_controls = (
              '  <div class="btnrow" style="margin-top:6px">\n'
              '    <button id="btn-left" class="hold">◀ RIG <kbd>A</kbd></button>\n'
              '    <button id="btn-right" class="hold">RIG ▶ <kbd>D</kbd></button>\n'
              '  </div>\n\n'
              '  <h2>INDEPENDENT ROD ROTATION <small>· ±5° nominal</small></h2>'
          )
          new_controls = (
              '  <h2>ROD ROTATION <small>· ±5° nominal per rod</small></h2>\n'
              '  <div class="btnrow" style="margin-top:6px">\n'
              '    <button id="btn-common-neg" class="hold">BOTH ↺ <kbd>A</kbd></button>\n'
              '    <button id="btn-common-pos" class="hold">BOTH ↻ <kbd>D</kbd></button>\n'
              '  </div>'
          )
          one('index.html', old_controls, new_controls)
          modal_line = '    <p><b>Present extensions.</b> Rolling loss, traction guards, elastic rail compliance and its fold, hybrid contact loss, scoring flight, timing risk, target viability, independent axial rotation of both rods, and compound opening–twist control.</p>'
          modal_add = modal_line + '\n    <p><b>Physical control correction.</b> The real apparatus does not translate the complete rail assembly laterally. The simulator fixes the rail centerline: <kbd>A</kbd>/<kbd>D</kbd> rotate both rods together, while <kbd>Q</kbd>/<kbd>E</kbd> and <kbd>U</kbd>/<kbd>O</kbd> provide independent left/right twist.</p>'
          one('index.html', modal_line, modal_add)

          intro = 'A steel ball rides two player-controlled rods that rise along the board. Opening the rods lowers the ball relative to their centerlines, creating the geometric drive that permits apparent uphill motion. The player can also rotate each rod independently through a nominal range of about **±5°**, creating common and differential twist modes, moving contact surfaces, axial ball spin, steering, traction demand, and—outside the exact parallel circular limit—weak propulsion or braking.'
          intro_new = intro + '\n\nThe physical apparatus does **not** translate the whole rail assembly laterally. The simulator fixes the rail centerline and maps `A` / `D` to common twist of both rods. Independent left/right twist remains available on `Q` / `E` and `U` / `O`.'
          one('README.md', intro, intro_new)
          one('README.md', '| `A` / `D` | Translate the complete rod assembly laterally |', '| `A` / `D` | Rotate both rods together: negative / positive common twist |')

          one('tests/physics-smoke.mjs', "import assert from 'node:assert/strict';\n", "import assert from 'node:assert/strict';\nimport { readFileSync } from 'node:fs';\n")
          marker = "assert.ok(pHit(0.30, 0.027) > pHit(0.55, 0.027));\n"
          guard = marker + "\n// The physical model must not expose artificial whole-rig translation.\n{\n  const sim = new Sim();\n  assert.equal(typeof sim.setManualShift, 'undefined');\n  assert.equal(Object.hasOwn(sim, 'z'), false);\n  const mainSource = readFileSync(new URL('../js/main.js', import.meta.url), 'utf8');\n  assert.match(mainSource, /common-neg/);\n  assert.match(mainSource, /common-pos/);\n  assert.doesNotMatch(mainSource, /setManualShift/);\n}\n"
          one('tests/physics-smoke.mjs', marker, guard)
          one('package.json', '  "version": "2.0.0",', '  "version": "2.0.1",')
          PY

          if grep -R -nE 'setManualShift|manualShift|zRateMax|^[[:space:]]+zMax:' js index.html README.md; then
            echo 'Artificial lateral-shift control remains in source.' >&2
            exit 1
          fi

      - name: Validate corrected simulator
        run: |
          npm run check
          npm run test:physics

      - name: Commit corrected physical controls
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html README.md package.json js/main.js js/physics.js js/scene.js js/hud.js tests/physics-smoke.mjs
          git commit -m "fix: repurpose A-D as common rod twist"
          git push
